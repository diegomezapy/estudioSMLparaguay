name: Deploy Shinylive App to GitHub Pages

on:
  push:
    branches: ["diego", "main", "master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install dependencies
        run: |
          Rscript -e 'install.packages(c("shinylive", "httpuv"), repos="https://packagemanager.posit.co/cran/__linux__/jammy/latest")'

      - name: Build Shinylive app
        run: |
          Rscript -e 'shinylive::export(".", "site")'

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
